# Pilot on a fixed anatomical ROI/patch; original acquisition grid is retained.
seed: 42
steps: 1000
lr: 0.0003
eval_every: 100
eval_masks: 10
mask_strategy: fitted
evaluation_mask_strategy: fitted
stress_evaluation:
  # Separate sensitivity report; never pooled into primary checkpoint selection.
  seconds: [16, 32]
query_chunk: 512
limits:
  max_vertices: 256
  max_frames: 256
mask:
  # Used by legacy ablations only; fitted samples training-family gap templates.
  gap_lengths: [1, 2, 4, 8, 16]
  max_gaps: 3
  allow_edges: true
  min_observations: 2
  empirical_probability: 0.5
model:
  d_model: 64
  n_blocks: 4
  n_heads: 4
  attn_mode: factorized
  factorized_time_window: 0
  window_vertices: 16
  window_time: 8
  use_routing: true
  with_inr_head: true
  inr_hidden: 64
  inr_k_neighbors: 6
  with_z_head: false
